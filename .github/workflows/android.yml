name: android-apk
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Сгенерировать нативный проект
        run: npm install && npx cap add android
        working-directory: android
      - name: Разрешить http:// (сервер в Termux или домашней сети)
        run: sed -i 's#<application#<application android:usesCleartextTraffic="true"#' app/src/main/AndroidManifest.xml
        working-directory: android/android
      - name: Генерация иконок Android
        run: npx @capacitor/assets generate --android
        working-directory: android
      - name: Подготовить локальные файлы
        run: node sync-local.mjs
        working-directory: android
      - name: Собрать debug-APK
        run: npm run apk
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: rod-android-debug
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
