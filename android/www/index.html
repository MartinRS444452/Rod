<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E2B28"><title>Род</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E2B28;color:#E6EDE9;font:16px system-ui,sans-serif;padding:24px}
main{width:100%;max-width:420px}h1{font:600 56px Georgia,serif;margin:0 0 6px}h1 i{color:#D2A857;font-style:normal}
p{color:#9fb3ab;margin:0 0 18px}label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9fb3ab;display:block;margin:12px 0 6px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #2C403B;background:#fff;color:#0E2B28;font-size:16px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#D2A857;color:#0E2B28;font-weight:800;font-size:16px}
.err{color:#ffb4a8;min-height:22px;margin-top:10px;font-size:14px}small{color:#7f958d;display:block;margin-top:14px;line-height:1.5}
</style></head><body><main>
<h1>Род<i>.</i></h1><p>Укажите адрес вашего сервера «Рода» — он запомнится.</p>
<form id="f"><label for="u">Адрес сервера</label><input id="u" type="url" inputmode="url" placeholder="https://rod.example.com" autocomplete="url" required>
<button type="submit">Открыть</button><div class="err" id="e" role="alert"></div></form>
<small>Сервер на этом же телефоне (Termux): <b>http://127.0.0.1:3000</b>.<br>Сменить адрес позже: откройте приложение с зажатой кнопкой «Назад» или очистите его данные.</small>
</main>
<script>
const KEY='rod:server',u=document.getElementById('u'),e=document.getElementById('e');
const go=url=>{location.replace(url)};
const saved=localStorage.getItem(KEY),q=new URLSearchParams(location.search);
if(saved&&!q.has('change')){ // сервер уже известен: проверяем доступность и открываем
  fetch(saved.replace(/\/$/,'')+'/healthz',{mode:'no-cors'}).then(()=>go(saved),()=>{u.value=saved;e.textContent='Сервер сейчас недоступен. Проверьте, что он запущен и есть интернет, или введите другой адрес.'});
}else if(saved)u.value=saved;
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();e.textContent='';let url;
  try{url=new URL(u.value.trim()).origin}catch{e.textContent='Введите адрес целиком, например https://rod.example.com';return}
  try{await fetch(url+'/healthz',{mode:'no-cors'})}catch{e.textContent='Не удаётся связаться с сервером по этому адресу.';return}
  localStorage.setItem(KEY,url);go(url)};
</script></body></html>
